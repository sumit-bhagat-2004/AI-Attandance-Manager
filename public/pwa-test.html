<!DOCTYPE html>
<html>
<head>
    <title>PWA Test - EduTrack AI</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #0f172a; color: white; }
        .container { max-width: 800px; margin: 0 auto; }
        .test-item { margin: 20px 0; padding: 15px; background: #1e293b; border-radius: 8px; }
        .success { border-left: 4px solid #10b981; }
        .warning { border-left: 4px solid #f59e0b; }
        .error { border-left: 4px solid #ef4444; }
        button { background: #06b6d4; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #0891b2; }
        pre { background: #000; padding: 10px; border-radius: 5px; overflow: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 PWA Functionality Test</h1>
        <p>This page tests all PWA features for EduTrack AI</p>

        <div id="manifest-test" class="test-item">
            <h3>📄 Manifest.json Test</h3>
            <p id="manifest-result">Testing...</p>
        </div>

        <div id="sw-test" class="test-item">
            <h3>⚙️ Service Worker Test</h3>
            <p id="sw-result">Testing...</p>
        </div>

        <div id="icons-test" class="test-item">
            <h3>🎨 Icons Test</h3>
            <div id="icons-result">Testing...</div>
        </div>

        <div id="install-test" class="test-item">
            <h3>📱 Install Prompt Test</h3>
            <p id="install-result">Testing...</p>
            <button onclick="testInstallPrompt()">Test Install Prompt</button>
        </div>

        <div id="offline-test" class="test-item">
            <h3>🌐 Offline Test</h3>
            <p id="offline-result">Testing...</p>
            <button onclick="testOffline()">Test Offline Functionality</button>
        </div>

        <div class="test-item">
            <h3>🔄 Actions</h3>
            <button onclick="location.href='/'">Go to App</button>
            <button onclick="location.href='/sign-in'">Go to Sign-in</button>
            <button onclick="registerServiceWorker()">Register Service Worker</button>
            <button onclick="clearCache()">Clear Cache</button>
        </div>
    </div>

    <script>
        // Test manifest.json
        async function testManifest() {
            try {
                const response = await fetch('/manifest.json');
                if (response.ok) {
                    const manifest = await response.json();
                    document.getElementById('manifest-result').innerHTML = `
                        <span class="success">✅ Manifest loaded successfully</span><br>
                        Name: ${manifest.name}<br>
                        Icons: ${manifest.icons.length} icons found<br>
                        Start URL: ${manifest.start_url}
                    `;
                    document.getElementById('manifest-test').className = 'test-item success';
                } else {
                    throw new Error('Failed to load manifest');
                }
            } catch (error) {
                document.getElementById('manifest-result').innerHTML = `❌ Error: ${error.message}`;
                document.getElementById('manifest-test').className = 'test-item error';
            }
        }

        // Test Service Worker
        async function testServiceWorker() {
            try {
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    const swResponse = await fetch('/sw.js');
                    
                    if (swResponse.ok) {
                        document.getElementById('sw-result').innerHTML = `
                            <span class="success">✅ Service Worker file accessible</span><br>
                            Registrations: ${registrations.length}<br>
                            Status: ${registrations.length > 0 ? 'Registered' : 'Not registered'}
                        `;
                        document.getElementById('sw-test').className = 'test-item success';
                    } else {
                        throw new Error('Service Worker file not found');
                    }
                } else {
                    throw new Error('Service Workers not supported');
                }
            } catch (error) {
                document.getElementById('sw-result').innerHTML = `❌ Error: ${error.message}`;
                document.getElementById('sw-test').className = 'test-item error';
            }
        }

        // Test Icons
        async function testIcons() {
            const iconSizes = [72, 96, 144, 152, 180, 192, 384, 512];
            let results = '';
            let allGood = true;

            for (const size of iconSizes) {
                try {
                    const response = await fetch(`/icons/icon-${size}x${size}.png`);
                    if (response.ok) {
                        results += `✅ ${size}x${size} icon found<br>`;
                    } else {
                        results += `❌ ${size}x${size} icon missing<br>`;
                        allGood = false;
                    }
                } catch (error) {
                    results += `❌ ${size}x${size} icon error<br>`;
                    allGood = false;
                }
            }

            document.getElementById('icons-result').innerHTML = results;
            document.getElementById('icons-test').className = allGood ? 'test-item success' : 'test-item warning';
        }

        // Test Install Prompt
        function testInstallPrompt() {
            if ('serviceWorker' in navigator) {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    document.getElementById('install-result').innerHTML = '✅ Install prompt available';
                    document.getElementById('install-test').className = 'test-item success';
                    
                    // Show the prompt
                    e.prompt();
                    
                    e.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === 'accepted') {
                            document.getElementById('install-result').innerHTML = '✅ User accepted install';
                        } else {
                            document.getElementById('install-result').innerHTML = '⚠️ User dismissed install';
                        }
                    });
                });

                // Check if already installed
                if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
                    document.getElementById('install-result').innerHTML = '✅ App already installed';
                    document.getElementById('install-test').className = 'test-item success';
                } else {
                    document.getElementById('install-result').innerHTML = '⚠️ Not installed yet. Install prompt will appear when available.';
                    document.getElementById('install-test').className = 'test-item warning';
                }
            } else {
                document.getElementById('install-result').innerHTML = '❌ PWA not supported';
                document.getElementById('install-test').className = 'test-item error';
            }
        }

        // Test Offline
        async function testOffline() {
            try {
                // Test if offline page exists
                const response = await fetch('/offline.html');
                if (response.ok) {
                    document.getElementById('offline-result').innerHTML = '✅ Offline page exists and accessible';
                    document.getElementById('offline-test').className = 'test-item success';
                } else {
                    throw new Error('Offline page not found');
                }
            } catch (error) {
                document.getElementById('offline-result').innerHTML = `❌ Error: ${error.message}`;
                document.getElementById('offline-test').className = 'test-item error';
            }
        }

        // Register Service Worker
        async function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                try {
                    const registration = await navigator.serviceWorker.register('/sw.js');
                    alert('Service Worker registered successfully!');
                    console.log('SW registered: ', registration);
                } catch (error) {
                    alert('Service Worker registration failed: ' + error.message);
                    console.error('SW registration failed: ', error);
                }
            }
        }

        // Clear Cache
        async function clearCache() {
            if ('caches' in window) {
                const cacheNames = await caches.keys();
                await Promise.all(cacheNames.map(name => caches.delete(name)));
                alert('Cache cleared successfully!');
            }
        }

        // Run tests on load
        window.onload = function() {
            testManifest();
            testServiceWorker();
            testIcons();
            testInstallPrompt();
            testOffline();
        };
    </script>
</body>
</html>
