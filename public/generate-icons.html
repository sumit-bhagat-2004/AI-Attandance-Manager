<!DOCTYPE html>
<html>
<head>
    <title>PWA Icon Converter</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .icon-container { margin: 20px 0; }
        canvas { border: 1px solid #ccc; margin: 10px; }
        button { background: #06b6d4; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>PWA Icon Generator - Convert to PNG</h1>
    <p>Click the buttons below to download PNG versions of the icons:</p>
    
    <div class="icon-container">
        <h3>16x16 Icon</h3>
        <canvas id="canvas16" width="16" height="16"></canvas>
        <button onclick="downloadIcon('canvas16', 'icon-16x16.png')">Download 16x16 PNG</button>
    </div>
    
    <div class="icon-container">
        <h3>32x32 Icon</h3>
        <canvas id="canvas32" width="32" height="32"></canvas>
        <button onclick="downloadIcon('canvas32', 'icon-32x32.png')">Download 32x32 PNG</button>
    </div>
    
    <div class="icon-container">
        <h3>144x144 Icon</h3>
        <canvas id="canvas144" width="144" height="144"></canvas>
        <button onclick="downloadIcon('canvas144', 'icon-144x144.png')">Download 144x144 PNG</button>
    </div>
    
    <div class="icon-container">
        <h3>180x180 Icon (Apple Touch)</h3>
        <canvas id="canvas180" width="180" height="180"></canvas>
        <button onclick="downloadIcon('canvas180', 'icon-180x180.png')">Download 180x180 PNG</button>
    </div>
    
    <div class="icon-container">
        <h3>192x192 Icon</h3>
        <canvas id="canvas192" width="192" height="192"></canvas>
        <button onclick="downloadIcon('canvas192', 'icon-192x192.png')">Download 192x192 PNG</button>
    </div>
    
    <div class="icon-container">
        <h3>512x512 Icon</h3>
        <canvas id="canvas512" width="512" height="512"></canvas>
        <button onclick="downloadIcon('canvas512', 'icon-512x512.png')">Download 512x512 PNG</button>
    </div>

    <script>
        function createIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            
            // Create gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#06b6d4');
            gradient.addColorStop(0.5, '#8b5cf6');
            gradient.addColorStop(1, '#ec4899');
            
            // Fill background with gradient
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Add rounded corners
            ctx.globalCompositeOperation = 'destination-in';
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, size * 0.2);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
            
            // Add text
            ctx.fillStyle = 'white';
            ctx.font = `bold ${Math.floor(size * 0.3)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('EA', size/2, size/2);
        }
        
        function downloadIcon(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // Create all icons when page loads
        window.onload = function() {
            createIcon('canvas16', 16);
            createIcon('canvas32', 32);
            createIcon('canvas144', 144);
            createIcon('canvas180', 180);
            createIcon('canvas192', 192);
            createIcon('canvas512', 512);
        };
    </script>
</body>
</html>
